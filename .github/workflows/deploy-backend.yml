name: Deploy Backend to Lightsail

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deployment/nginx.conf'
      - 'deployment/ecosystem.config.js'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest
    env:
      LIGHTSAIL_INSTANCE_NAME: ${{ vars.AWS_LIGHTSAIL_INSTANCE_NAME || secrets.AWS_LIGHTSAIL_INSTANCE_NAME || 'Node-js-1' }}
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-south-1' }}
      SSH_USER: bitnami
      SSH_HOST: 65.2.9.216
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Resolve server SSH access
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$LIGHTSAIL_SSH_KEY" ]; then
            printf '%s' "$LIGHTSAIL_SSH_KEY" > lightsail.pem
            chmod 600 lightsail.pem
            echo "SSH_OPTS=-i lightsail.pem -o StrictHostKeyChecking=no" >> "$GITHUB_ENV"
          else
            echo "::error::LIGHTSAIL_SSH_KEY secret is not set."
            exit 1
          fi

      - name: Sync backend code to server
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'uploads' \
            -e "ssh $SSH_OPTS" \
            ./backend/ "$SSH_USER@$SSH_HOST:/home/bitnami/feriwala/backend/"
          scp $SSH_OPTS ./deployment/ecosystem.config.js "$SSH_USER@$SSH_HOST:/home/bitnami/feriwala/ecosystem.config.js"

      - name: Install dependencies and restart
        run: |
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" << 'EOFSSH'
            set -e
            cd /home/bitnami/feriwala/backend
            npm ci --omit=dev || npm install --omit=dev
            node seed-categories.js 2>/dev/null || true
            cd ..
            PM2_BIN=$(command -v pm2 || echo /opt/bitnami/node/lib/node_modules/pm2/bin/pm2)
            "$PM2_BIN" delete feriwala-api 2>/dev/null || true
            "$PM2_BIN" delete feriwala-backend 2>/dev/null || true
            "$PM2_BIN" start ecosystem.config.js
            "$PM2_BIN" save
            echo "=== Deployment complete ==="
            "$PM2_BIN" status
          EOFSSH

      - name: Update nginx config and reload
        run: |
          scp $SSH_OPTS ./deployment/nginx.conf "$SSH_USER@$SSH_HOST:/home/bitnami/feriwala/deployment/nginx.conf"
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" << 'EOFSSH'
            set -e
            echo "=== Updating nginx config ==="
            
            # Find the SSL cert path (adjust if different on server)
            CERT_PATH=""
            for p in /etc/letsencrypt/live/feriwala.in /opt/bitnami/nginx/conf/bitnami/certs; do
              if [ -d "$p" ]; then
                CERT_PATH="$p"
                break
              fi
            done
            echo "SSL cert path: $CERT_PATH"
            
            # If cert path is different, update the config
            if [ -n "$CERT_PATH" ] && [ "$CERT_PATH" != "/etc/letsencrypt/live/feriwala.in" ]; then
              sed -i "s|/etc/letsencrypt/live/feriwala.in/fullchain.pem|$CERT_PATH/server.crt|g" /home/bitnami/feriwala/deployment/nginx.conf
              sed -i "s|/etc/letsencrypt/live/feriwala.in/privkey.pem|$CERT_PATH/server.key|g" /home/bitnami/feriwala/deployment/nginx.conf
            fi
            
            # Find where to put the config
            if [ -d "/opt/bitnami/nginx/conf/server_blocks" ]; then
              sudo cp /home/bitnami/feriwala/deployment/nginx.conf /opt/bitnami/nginx/conf/server_blocks/feriwala.conf
              # Remove any conflicting default
              sudo rm -f /opt/bitnami/nginx/conf/server_blocks/default.conf 2>/dev/null || true
            elif [ -d "/etc/nginx/conf.d" ]; then
              sudo cp /home/bitnami/feriwala/deployment/nginx.conf /etc/nginx/conf.d/feriwala.conf
              sudo rm -f /etc/nginx/conf.d/default.conf 2>/dev/null || true
              sudo rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
            fi
            
            # Test and reload
            if sudo nginx -t 2>&1; then
              sudo systemctl reload nginx 2>/dev/null || sudo /opt/bitnami/ctlscript.sh restart nginx 2>/dev/null || sudo nginx -s reload
              echo "=== Nginx reloaded successfully ==="
            else
              echo "=== Nginx config test failed, not reloading ==="
              sudo nginx -t
            fi
          EOFSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f lightsail.pem lightsail-cert.pub access.json
