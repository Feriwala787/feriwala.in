# ─── feriwala.in — Customer Web App + Admin Portal ─────────────────────────────
server {
    listen 80;
    server_name feriwala.in www.feriwala.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name feriwala.in www.feriwala.in;

    ssl_certificate /etc/letsencrypt/live/feriwala.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feriwala.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Admin portal at /portal path
    location /portal {
        alias /home/bitnami/feriwala/admin-portal/build;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Policy pages served by Node.js
    location ~ ^/(privacy|terms|refund|contact|about|shipping|delete-account|admin) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded assets
    location /uploads/ {
        alias /home/bitnami/feriwala/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Customer web app (Flutter) — catch-all
    location / {
        root /home/bitnami/feriwala/customer-web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 10M;
}

# ─── api.feriwala.in — Backend API + WebSocket (HTTPS) ─────────────────────────
server {
    listen 80;
    server_name api.feriwala.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.feriwala.in;

    ssl_certificate /etc/letsencrypt/live/feriwala.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feriwala.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        alias /home/bitnami/feriwala/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 10M;
}

