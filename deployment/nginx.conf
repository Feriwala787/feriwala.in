# ─── admin.feriwala.in — Admin Portal (React) ─────────────────────────────────
server {
    listen 80;
    server_name admin.feriwala.in;

    location / {
        root /home/bitnami/feriwala/admin-portal/build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy for admin portal API calls
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
