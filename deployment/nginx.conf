# ─── feriwala.in — Landing page + policy pages (HTTPS) ─────────────────────────
server {
    listen 80;
    server_name feriwala.in www.feriwala.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name feriwala.in www.feriwala.in;

    ssl_certificate /etc/letsencrypt/live/feriwala.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feriwala.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Landing page and all non-API routes served by Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploaded assets
    location /uploads/ {
        alias /home/bitnami/feriwala/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 10M;
}

